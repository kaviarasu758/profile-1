name: Update profile art

on:
  schedule:
    # Runs at 06:17 UTC daily
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Fetch contribution data
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python scripts/fetch_contributions.py --username "$GITHUB_USERNAME"

      - name: Render animated heatmap SVG
        run: |
          python scripts/render_heatmap_svg.py

      - name: Auto-commit refreshed graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
